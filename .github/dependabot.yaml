version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
    open-pull-requests-limit: 10
    groups:
      protobuf-es:
        patterns:
          - "@bufbuild/protobuf"
          - "@bufbuild/protoplugin"
          - "@bufbuild/protoc-gen-es"
      lint-and-format:
        patterns:
          - "@biomejs/biome"
          - "@bufbuild/license-header"
